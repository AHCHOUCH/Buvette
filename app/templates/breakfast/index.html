{% extends 'layouts/base.html' %}{% block title %}Breakfast — Buvette Manager{% endblock %}{% block content %}
<div class="page-header"><h1>Breakfast Order</h1><a class="btn btn-secondary" href="{{ url_for('breakfast.products') }}">Products</a></div>
<form method="post" class="card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-row"><label>Client</label><select name="client_id" required>{% for client in clients %}<option value="{{ client.id }}">{{ client.name }} {{ '(' ~ client.account_code ~ ')' if client.account_code }}</option>{% endfor %}</select></div><h2>Products</h2><div class="touch-grid">{% for product in products %}<div class="touch-card"><strong>{{ product.name }}</strong><span>{{ product.price }}</span><div class="quantity-row"><button type="button" class="btn btn-secondary" data-step="-1" data-target="qty_{{ product.id }}">−</button><input id="qty_{{ product.id }}" name="qty_{{ product.id }}" value="0" inputmode="numeric"><button type="button" class="btn btn-primary" data-step="1" data-target="qty_{{ product.id }}">+</button></div></div>{% endfor %}</div><div class="form-row"><label>Notes</label><textarea name="notes"></textarea></div><button class="btn btn-primary btn-large">Confirm Breakfast Charge</button></form>
{% endblock %}
