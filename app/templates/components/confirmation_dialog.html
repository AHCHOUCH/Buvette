{% macro confirmation_dialog(id='confirm-dialog', title='Confirm action', message='Are you sure?') -%}
<div class="modal" id="{{ id }}" role="dialog" aria-modal="true" hidden data-confirm-dialog>
  <div class="modal-panel">
    <h2>{{ title }}</h2>
    <p>{{ message }}</p>
    <div class="button-row">
      <button class="btn btn-secondary btn-large" type="button" data-confirm-cancel>Cancel</button>
      <button class="btn btn-danger btn-large" type="button" data-confirm-ok>Confirm</button>
    </div>
  </div>
</div>
{%- endmacro %}
