{% macro empty_state(title, message, action_label=None, action_href=None) -%}
<section class="empty-state">
  <h2>{{ title }}</h2>
  <p>{{ message }}</p>
  {% if action_label and action_href %}<a class="btn btn-primary btn-large" href="{{ action_href }}">{{ action_label }}</a>{% endif %}
</section>
{%- endmacro %}
