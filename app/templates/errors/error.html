{% extends 'layouts/base.html' %}
{% block title %}Error {{ status_code }} — Buvette Manager{% endblock %}
{% block content %}
<section class="card">
  <h1 class="card-title">Error {{ status_code }}</h1>
  <p>{{ error.description if error and error.description else 'The requested action could not be completed.' }}</p>
  <a class="btn btn-primary" href="{{ url_for('index') }}">Return home</a>
</section>
{% endblock %}
