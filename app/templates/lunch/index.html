{% extends 'layouts/base.html' %}{% block title %}Lunch — Buvette Manager{% endblock %}{% block content %}<div class="page-header"><h1>Lunch Charge</h1><a class="btn btn-secondary" href="{{ url_for('lunch.menus') }}">Weekly Menus</a></div><section class="card"><h2>Today: {{ menu.name if menu else 'No menu configured' }}</h2><p>Price: {{ menu.price if menu else '—' }}</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Client</label><select name="client_id">{% for client in clients %}<option value="{{ client.id }}">{{ client.name }}</option>{% endfor %}</select><button class="btn btn-primary btn-large">Confirm Lunch Charge</button></form></section>{% endblock %}
